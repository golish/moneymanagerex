name: macOS CI Build

# Fork-only workflow: upstream has no macOS CI, so this exists purely to
# produce a self-contained .dmg for local testing. Not part of the upstream
# pull request.
#
# This mirrors the official recipe in BUILD.md rather than using Homebrew's
# wxWidgets: wx is built from source with --disable-shared so the resulting
# .app statically links wx and runs on a machine that has no Homebrew at all.
# A Homebrew (shared) wx build produces an .app that crashes on launch with
# missing /opt/homebrew/**/*.dylib.

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

env:
  WX_VERSION: 3.3.3

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: |
          brew update
          brew install ccache gettext cmake
          brew link --force gettext

      - name: Restore wxWidgets cache
        id: restore-wx
        uses: actions/cache/restore@v4
        with:
          path: ~/wx/wxWidgets-${{ env.WX_VERSION }}
          key: wx-${{ env.WX_VERSION }}-macos-14-universal-static-v3

      - name: Build wxWidgets (static, universal)
        if: steps.restore-wx.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/wx && cd ~/wx
          curl -fsSL -O https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2
          tar xjf wxWidgets-${WX_VERSION}.tar.bz2
          cd wxWidgets-${WX_VERSION}
          mkdir -p build-cocoa && cd build-cocoa
          ../configure \
            --enable-std_containers \
            --disable-shared \
            --with-cxx=17 \
            --with-macosx-version-min=11.0 \
            --without-libtiff \
            --with-regex=builtin \
            --with-libjpeg=builtin \
            --with-libpng=builtin \
            --with-zlib=builtin \
            --with-expat=builtin \
            --enable-universal-binary=arm64,x86_64
          make -j$(sysctl -n hw.ncpu)

      - name: Save wxWidgets cache
        if: steps.restore-wx.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/wx/wxWidgets-${{ env.WX_VERSION }}
          key: wx-${{ env.WX_VERSION }}-macos-14-universal-static-v3

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build MoneyManagerEx
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_CXX_FLAGS="-w" \
            -DwxWidgets_CONFIG_EXECUTABLE=$HOME/wx/wxWidgets-${WX_VERSION}/build-cocoa/wx-config \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ..
          cmake --build . -j$(sysctl -n hw.ncpu) --target package
          ls -la *.dmg

      - name: Verify the bundle is self-contained
        run: |
          cd build
          # The .dmg carries a licence agreement, which makes `hdiutil attach`
          # interactive, so inspect the .app that CPack packages instead - it is
          # the same binary that ends up in the disk image.
          app=$(find . -maxdepth 3 -name "*.app" -type d | head -n 1)
          bin=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -n 1)
          echo "app: $app"
          echo "bin: $bin"
          echo "== architectures =="
          lipo -info "$bin"
          echo "== linked libraries =="
          otool -L "$bin"
          # Fail if anything outside the OS-provided paths is referenced: those
          # are exactly the libraries that will be missing on someone else's Mac.
          if otool -L "$bin" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "::error::Bundle links non-system libraries; it will not run on a clean Mac."
            exit 1
          fi
          echo "OK: only system libraries are referenced."
          # Both slices must be present or the universal claim is false.
          lipo -info "$bin" | grep -q "arm64" || { echo "::error::missing arm64 slice"; exit 1; }
          lipo -info "$bin" | grep -q "x86_64" || { echo "::error::missing x86_64 slice"; exit 1; }
          echo "OK: universal binary contains both arm64 and x86_64."

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mmex-macos-universal
          path: build/*.dmg
          if-no-files-found: error
